[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-tempo"
version = "0.1.0"
description = "Track source-code momentum across Git workspaces"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ren Diao" }]
dependencies = []

[project.scripts]
source-tempo = "source_tempo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work-tempo"
version = "0.1.0"
description = "Track source-code momentum across Git workspaces"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ren Diao" }]
keywords = ["git", "loc", "churn", "metrics", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/endario/work-tempo"
Source = "https://github.com/endario/work-tempo"
Issues = "https://github.com/endario/work-tempo/issues"

[project.scripts]
work-tempo = "work_tempo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
work_tempo = ["defaults.json"]
